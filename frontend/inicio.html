<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planazo - Inicio</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/inicio.css">
</head>
<body>
  <main class="contenedor-login">
    <h1>PLANAZO</h1>
    <p id="saludo" class="saludo">Hola</p>

    <h2>Mis planes</h2>
    <button id="crear-plan" type="button">Crear nuevo plan</button>

    <section class="filtros">
      <label for="buscar-nombre">Buscar por nombre</label>
      <input id="buscar-nombre" type="text" placeholder="Buscar por nombre">

      <label for="filtro-estado">Estado</label>
      <select id="filtro-estado">
        <option value="">Todos</option>
        <option value="pendiente">Pendiente</option>
        <option value="confirmado">Confirmado</option>
        <option value="cancelado">Cancelado</option>
      </select>

      <label for="filtro-fecha">Fecha</label>
      <select id="filtro-fecha">
        <option value="">Todas las fechas</option>
        <option value="proximos7">Próximos 7 días</option>
        <option value="vencidos">Vencidos</option>
      </select>

      <button id="limpiar-filtros" type="button">Limpiar filtros</button>
      <p id="filtros-activos">Sin filtros activos</p>
    </section>

    <section id="lista-planes" class="lista-planes"></section>
  </main>

  <script src="js/inicio.js"></script>
</body>
</html>
