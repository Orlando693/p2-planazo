<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planazo - Registrarse</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/registro.css">
</head>
<body>
  <main class="contenedor-login">
    <h1>PLANAZO</h1>

    <form id="formulario-registro" novalidate>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">

      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" placeholder="tu@correo.com">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="Tu contraseña">

      <p id="mensaje" class="mensaje" aria-live="polite"></p>

      <button type="submit">Registrarse</button>
    </form>

    <p class="registro">¿Ya tienes cuenta?</p>
    <a href="login.html">Iniciar sesión</a>
  </main>

  <script src="js/registro.js"></script>
</body>
</html>
