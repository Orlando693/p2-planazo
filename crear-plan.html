<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planazo - Crear plan</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/crear-plan.css">
</head>
<body>
  <main class="contenedor-login">
    <h1>PLANAZO</h1>
    <h2>Crear nuevo plan</h2>

    <form id="formulario-plan" novalidate>
      <label for="nombre">Nombre del plan</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ejemplo: Salida sábado">

      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" placeholder="Describe el plan"></textarea>

      <label for="fecha">Fecha</label>
      <input type="date" id="fecha" name="fecha">

      <p id="mensaje" class="mensaje" aria-live="polite"></p>

      <button type="submit">Crear plan</button>
      <button id="volver" class="volver" type="button">Volver</button>
    </form>
  </main>

  <script src="js/crear-plan.js"></script>
</body>
</html>
